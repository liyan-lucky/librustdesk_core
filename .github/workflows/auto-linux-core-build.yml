name: 自动触发 Linux 核心构建

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/cleanup-releases.yml'
      - '.github/workflows/auto-linux-core-build.yml'
      - '.github/workflows/update-core-release-notes.yml'
      - '.github/workflows/manual-update-core-release-notes.yml'

permissions:
  actions: write
  contents: write

jobs:
  trigger:
    name: 触发并等待 Linux 核心构建
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 触发 Linux 构建流程
        id: trigger_linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ref_name="${{ github.ref_name }}"
          if [ -z "$ref_name" ]; then
            ref_name="main"
          fi
          echo "ref_name=$ref_name" >> "$GITHUB_OUTPUT"
          gh workflow run build-core-linux.yml --repo "${{ github.repository }}" --ref "$ref_name"

      - name: 等待 Linux 构建流程完成
        id: linux_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ steps.trigger_linux.outputs.ref_name }}
        run: |
          set -euo pipefail
          run_id=""
          for i in $(seq 1 30); do
            run_id=$(
              gh run list --repo "${{ github.repository }}" \
                --workflow build-core-linux.yml \
                --branch "$REF_NAME" \
                --limit 10 \
                --json databaseId,status,conclusion,event \
                --jq '[.[] | select(.event == "workflow_dispatch")][0].databaseId // empty'
            )
            if [ -n "$run_id" ]; then
              break
            fi
            echo "等待 Linux 构建流程出现... ($i)"
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "没有找到 Linux 构建流程。"
            exit 1
          fi
          echo "linux_run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --repo "${{ github.repository }}" --exit-status

      - name: 定位最新核心库 Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(
            gh release list --repo "${{ github.repository }}" --limit 50 --json tagName,createdAt \
              --jq '[.[] | select(.tagName | test("^core-[0-9]{3}$"))] | sort_by(.createdAt) | last | .tagName'
          )
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "没有找到核心库 Release。"
            exit 1
          fi
          number="${tag#core-}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: 生成发布说明
        env:
          RELEASE_NUMBER: ${{ steps.release.outputs.number }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          BUILD_OS: Ubuntu 22.04
        run: |
          bash .github/scripts/write-core-release-notes.sh release-notes.md

      - name: 更新发布说明
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "${{ steps.release.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --notes-file release-notes.md
