name: 构建 HarmonyOS 核心库（Windows）

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reserve_release_number:
    name: 预留发布版本号
    runs-on: ubuntu-latest
    outputs:
      release_number: ${{ steps.reserve.outputs.release_number }}
      tag: ${{ steps.reserve.outputs.tag }}
    steps:
      - name: 预留下一个核心库标签
        id: reserve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          existing_numbers=$(
            gh api repos/${{ github.repository }}/git/matching-refs/tags/core- --paginate --jq '.[].ref' \
              | sed 's#^refs/tags/##' \
              | grep -E '^core-[0-9]{3}$' \
              | sed 's/^core-//' \
              | sort -n || true
          )

          if [ -z "$existing_numbers" ]; then
            next=1
          else
            last=$(printf '%s\n' "$existing_numbers" | tail -1)
            next=$((10#$last + 1))
          fi

          release_number=$(printf '%03d' "$next")
          tag="core-$release_number"

          echo "Reserving release tag: $tag"
          gh api -X POST repos/${{ github.repository }}/git/refs \
            -f ref="refs/tags/$tag" \
            -f sha="${{ github.sha }}"

          echo "release_number=$release_number" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Windows 构建核心库（${{ matrix.target }}）
    needs: reserve_release_number
    runs-on: windows-2022
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-ohos
            lib_dir: arm64
            artifact_name: librustdesk_core
            release_file: librustdesk_core.a
          - target: x86_64-unknown-linux-ohos
            lib_dir: x86_64
            artifact_name: librustdesk_core_x86_64
            release_file: librustdesk_core_x86_64.a

    env:
      TARGET_TRIPLE: ${{ matrix.target }}
      RUST_TOOLCHAIN_VERSION: "1.88.0"
      RUSTDESK_HARMONY_BUILD_DIR: ${{ github.workspace }}\_build
      CARGO_TARGET_DIR: ${{ github.workspace }}\_build\native_rust_core\target
      VCPKG_ROOT: ${{ github.workspace }}\_build\vcpkg
      VCPKG_INSTALLED_ROOT: ${{ github.workspace }}\_build\vcpkg\installed
      RUST_BACKTRACE: full
      CARGO_BUILD_JOBS: 1
      RELEASE_ARTIFACT_MIN_BYTES: "100000000"
      RELEASE_ARTIFACT_MAX_BYTES: "250000000"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-unknown-linux-ohos,x86_64-unknown-linux-ohos

      - name: 安装 MSYS2
        uses: msys2/setup-msys2@v2
        with:
          install: >-
            base-devel
            make
            perl
            autoconf
            automake
            libtool
            pkgconf

      - name: 准备构建目录
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUSTDESK_HARMONY_BUILD_DIR" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_ROOT" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_INSTALLED_ROOT" | Out-Null

      - name: 下载 HarmonyOS SDK
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.HARMONYOS_SDK_TOKEN }}
          SDK_REPO: liyan-lucky/HarmonyOS_SDK_Tools
          SDK_TAG: windows_ohos_sdk_min_6.1.1
          SDK_ASSET: windows-ohos-sdk-min.zip
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw "Missing repository secret: HARMONYOS_SDK_TOKEN"
          }

          $sdkArchive = Join-Path $env:RUSTDESK_HARMONY_BUILD_DIR $env:SDK_ASSET
          $sdkRoot = Join-Path $env:RUSTDESK_HARMONY_BUILD_DIR "ohos-sdk"

          if (Test-Path $sdkRoot) {
            Remove-Item -Recurse -Force $sdkRoot
          }
          New-Item -ItemType Directory -Force -Path $sdkRoot | Out-Null

          gh release download $env:SDK_TAG `
            --repo $env:SDK_REPO `
            --pattern $env:SDK_ASSET `
            --dir $env:RUSTDESK_HARMONY_BUILD_DIR

          if (-not (Test-Path $sdkArchive)) {
            Get-ChildItem $env:RUSTDESK_HARMONY_BUILD_DIR | Format-List Name,Length,FullName
            throw "SDK asset was not downloaded: $sdkArchive"
          }

          if ($env:SDK_ASSET.EndsWith(".zip", [System.StringComparison]::OrdinalIgnoreCase)) {
            Expand-Archive -Path $sdkArchive -DestinationPath $sdkRoot -Force
          } elseif ($env:SDK_ASSET.EndsWith(".7z", [System.StringComparison]::OrdinalIgnoreCase)) {
            7z x -y $sdkArchive "-o$sdkRoot"
            if ($LASTEXITCODE -ne 0) {
              throw "7z extract failed with exit code $LASTEXITCODE"
            }
          } else {
            throw "Unsupported SDK archive format: $env:SDK_ASSET"
          }

          $clang = Get-ChildItem -Path $sdkRoot -Recurse -Filter clang.exe | Where-Object {
            $_.FullName -like "*native*llvm*bin*clang.exe"
          } | Select-Object -First 1

          if (-not $clang) {
            throw "clang.exe not found"
          }

          $llvmBinDir = Split-Path -Parent $clang.FullName
          $llvmDir = Split-Path -Parent $llvmBinDir
          $nativeDir = Split-Path -Parent $llvmDir
          $sdkNativeRoot = Split-Path -Parent $nativeDir

          if (-not (Test-Path (Join-Path $nativeDir "sysroot"))) {
            throw "sysroot not found. Expected: $nativeDir\sysroot"
          }

          if (-not (Test-Path (Join-Path $nativeDir "llvm\lib"))) {
            throw "llvm/lib not found. Expected: $nativeDir\llvm\lib"
          }

          "RUSTDESK_HARMONY_HOST_SDK=$sdkNativeRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OHOS_SDK_HOME=$sdkNativeRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OHOS_NDK_HOME=$sdkNativeRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "SDK root: $sdkNativeRoot"
          Write-Host "Native dir: $nativeDir"
          Get-ChildItem "$nativeDir" | Select-Object Name

      - name: 缓存 Cargo 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}\_build\native_rust_core\target
          key: windows-ohos-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            windows-ohos-cargo-${{ matrix.target }}-

      - name: 准备 libsodium-sys 源码
        shell: pwsh
        run: |
          $registrySrc = Join-Path $env:CARGO_HOME "registry\src\manual"
          $crateDir = Join-Path $registrySrc "libsodium-sys-0.2.7"

          if (-not (Test-Path $crateDir)) {
            New-Item -ItemType Directory -Force -Path $registrySrc | Out-Null
            $crateFile = Join-Path $env:RUNNER_TEMP "libsodium-sys-0.2.7.crate"
            Invoke-WebRequest -Uri "https://crates.io/api/v1/crates/libsodium-sys/0.2.7/download" -OutFile $crateFile
            tar -xzf $crateFile -C $registrySrc
          }

      - name: 编译 libopus
        shell: pwsh
        run: |
          $opusVersion = "1.5.2"
          $targetArch = if ($env:TARGET_TRIPLE -eq "aarch64-unknown-linux-ohos") { "aarch64" } else { "x86_64" }
          $configureHost = if ($env:TARGET_TRIPLE -eq "aarch64-unknown-linux-ohos") { "aarch64-unknown-linux-gnu" } else { "x86_64-unknown-linux-gnu" }
          $clangTarget = if ($env:TARGET_TRIPLE -eq "aarch64-unknown-linux-ohos") { "aarch64-linux-ohos" } else { "x86_64-linux-ohos" }
          $triplet = if ($env:TARGET_TRIPLE -eq "aarch64-unknown-linux-ohos") { "arm64-linux" } else { "x64-linux" }
          $opusRoot = Join-Path $env:RUSTDESK_HARMONY_BUILD_DIR "opus-$targetArch"
          $opusZip = Join-Path $env:RUNNER_TEMP "opus-$opusVersion.tar.gz"
          $installRoot = Join-Path $env:VCPKG_INSTALLED_ROOT $triplet
          $includeDir = Join-Path $installRoot "include"
          $libDir = Join-Path $installRoot "lib"

          New-Item -ItemType Directory -Force -Path $opusRoot | Out-Null
          New-Item -ItemType Directory -Force -Path $includeDir | Out-Null
          New-Item -ItemType Directory -Force -Path $libDir | Out-Null

          Invoke-WebRequest -Uri "https://downloads.xiph.org/releases/opus/opus-$opusVersion.tar.gz" -OutFile $opusZip
          tar -xzf $opusZip -C $opusRoot --strip-components=1

          $msys2Cmd = (Get-Command msys2.cmd -ErrorAction SilentlyContinue).Source
          if (-not $msys2Cmd -and $env:RUNNER_TEMP) {
            $candidateMsys2Cmd = Join-Path $env:RUNNER_TEMP "setup-msys2\msys2.cmd"
            if (Test-Path $candidateMsys2Cmd) {
              $msys2Cmd = $candidateMsys2Cmd
            }
          }
          $bash = $null
          if ($msys2Cmd) {
            $bash = (& $msys2Cmd -c "cygpath -w /usr/bin/bash.exe").Trim()
          }
          if (-not $bash) {
            $bash = (Get-Command bash.exe -ErrorAction Stop).Source
          }
          $msysBin = Split-Path -Parent $bash
          $cygpath = Join-Path $msysBin "cygpath.exe"
          $env:PATH = "$msysBin;$env:PATH"

          $opusRootUnix = & $cygpath -u $opusRoot
          $installRootUnix = & $cygpath -u $installRoot
          $sdkUnix = & $cygpath -u $env:RUSTDESK_HARMONY_HOST_SDK

          $bashScript = Join-Path $env:RUNNER_TEMP "build-opus-ohos.sh"

          $extraConfigure = ""
          if ($targetArch -eq "x86_64") {
            $extraConfigure = "--disable-asm --disable-rtcd --disable-intrinsics"
          }

          $lines = @(
            "set -euo pipefail",
            "cd `"$opusRootUnix`"",
            "export CC=`"$sdkUnix/native/llvm/bin/clang.exe`"",
            "export AR=`"$sdkUnix/native/llvm/bin/llvm-ar.exe`"",
            "export RANLIB=`"$sdkUnix/native/llvm/bin/llvm-ranlib.exe`"",
            "export STRIP=`":`"",
            "export SYSROOT=`"$sdkUnix/native/sysroot`"",
            "export CFLAGS=`"--target=$clangTarget --sysroot=`$SYSROOT -fPIC -D__MUSL__`"",
            "export LDFLAGS=`"--target=$clangTarget --sysroot=`$SYSROOT`"",
            "./configure --host=$configureHost --prefix=`"$installRootUnix`" --enable-shared=no --enable-static=yes --disable-extra-programs --disable-doc $extraConfigure",
            "make -j2",
            "make install"
          )

          $lines | Set-Content -Path $bashScript -Encoding ascii

          Write-Host "==== build-opus-ohos.sh ===="
          Get-Content $bashScript

          & $bash $bashScript

          $header = Join-Path $includeDir "opus\opus_multistream.h"
          $libA = Join-Path $libDir "libopus.a"

          if (-not (Test-Path $header)) {
            throw "opus header not found: $header"
          }

          if (-not (Test-Path $libA)) {
            throw "libopus.a not found: $libA"
          }

          Write-Host "libopus prepared:"
          Get-Item $header, $libA | Format-List FullName,Length

      - name: 编译 librustdesk_core.a
        shell: pwsh
        run: |
          Write-Host "=== Environment ==="
          Write-Host "TARGET_TRIPLE: $env:TARGET_TRIPLE"
          Write-Host "RUSTDESK_HARMONY_HOST_SDK: $env:RUSTDESK_HARMONY_HOST_SDK"
          Write-Host "RUSTDESK_HARMONY_BUILD_DIR: $env:RUSTDESK_HARMONY_BUILD_DIR"
          Write-Host "VCPKG_ROOT: $env:VCPKG_ROOT"
          Write-Host "VCPKG_INSTALLED_ROOT: $env:VCPKG_INSTALLED_ROOT"
          Write-Host "CARGO_TARGET_DIR: $env:CARGO_TARGET_DIR"
          Write-Host "cargo: $(Get-Command cargo -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source)"
          Write-Host "rustc: $(Get-Command rustc -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source)"
          Write-Host "cmake: $(Get-Command cmake -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source)"
          Write-Host "ninja: $(Get-Command ninja -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source)"
          Write-Host "bash: $(Get-Command bash -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source)"
          Write-Host "=== Vcpkg installed ==="
          if (Test-Path $env:VCPKG_INSTALLED_ROOT) { Get-ChildItem $env:VCPKG_INSTALLED_ROOT -Recurse -Filter "*.a" | ForEach-Object { Write-Host "  $($_.FullName) $($_.Length)" } }
          Write-Host "=== Starting build ==="
          & pwsh -ExecutionPolicy Bypass -File .\scripts\build_native_bridge.ps1 -TargetTriple "$env:TARGET_TRIPLE" -Profile release

          if ($LASTEXITCODE -ne 0) {
            throw "build_native_bridge.ps1 failed with exit code $LASTEXITCODE"
          }

          $libDir = if ($env:TARGET_TRIPLE -eq "aarch64-unknown-linux-ohos") { "arm64" } else { "x86_64" }
          $builtLib = ".\entry\src\main\libs\$libDir\librustdesk_core.a"
          if (-not (Test-Path $builtLib)) {
            throw "Native build finished, but $builtLib was not found"
          }

          $releaseFile = if ($env:TARGET_TRIPLE -eq "aarch64-unknown-linux-ohos") { "librustdesk_core.a" } else { "librustdesk_core_x86_64.a" }
          Copy-Item -LiteralPath $builtLib -Destination ".\$releaseFile" -Force

      - name: 上传调试日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-logs-${{ matrix.lib_dir }}
          path: |
            build_debug_*.log
            cargo_build_*.log
            build_env_*.log
            _build/build-native-bridge-*.cmd
            _build/opus-*/build/*.log
            _build/opus-*-build/CMakeFiles/CMakeError.log
            _build/opus-*-build/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore

      - name: 校验最终产物
        shell: pwsh
        run: |
          $releaseFile = if ($env:TARGET_TRIPLE -eq "aarch64-unknown-linux-ohos") { "librustdesk_core.a" } else { "librustdesk_core_x86_64.a" }
          $artifact = ".\$releaseFile"

          if (-not (Test-Path $artifact)) {
            throw "$releaseFile was not generated"
          }

          Write-Host "===== Final Artifact ====="
          $artifactItem = Get-Item $artifact
          $artifactItem | Format-List Name,Length,FullName

          $minBytes = [int64]$env:RELEASE_ARTIFACT_MIN_BYTES
          $maxBytes = [int64]$env:RELEASE_ARTIFACT_MAX_BYTES
          if ($artifactItem.Length -lt $minBytes -or $artifactItem.Length -gt $maxBytes) {
            throw "Unexpected $releaseFile size: $($artifactItem.Length) bytes. Expected release artifact between $minBytes and $maxBytes bytes; check Cargo profile before publishing."
          }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.release_file }}
          if-no-files-found: error

      - name: 检查发布文件
        shell: pwsh
        run: |
          $releaseFile = if ($env:TARGET_TRIPLE -eq "aarch64-unknown-linux-ohos") { "librustdesk_core.a" } else { "librustdesk_core_x86_64.a" }
          Get-Item ".\$releaseFile" | Format-List Name,Length,FullName

          Write-Host "SHA256:"
          Get-FileHash ".\$releaseFile" -Algorithm SHA256

  release:
    name: 发布双架构核心库
    needs: [reserve_release_number, build]
    runs-on: ubuntu-latest
    if: needs.build.result == 'success'

    steps:
      - name: 下载 arm64 产物
        uses: actions/download-artifact@v4
        with:
          name: librustdesk_core
          path: ./release-assets

      - name: 下载 x86_64 产物
        uses: actions/download-artifact@v4
        with:
          name: librustdesk_core_x86_64
          path: ./release-assets

      - name: 校验 Release 产物
        run: |
          set -euo pipefail
          ls -la ./release-assets/
          min_bytes=100000000
          max_bytes=250000000
          for f in ./release-assets/librustdesk_core.a ./release-assets/librustdesk_core_x86_64.a; do
            if [ ! -f "$f" ]; then
              echo "Missing required release asset: $f"
              exit 1
            fi
            size=$(wc -c < "$f")
            echo "=== $f ==="
            echo "Size: $size bytes"
            if [ "$size" -lt "$min_bytes" ] || [ "$size" -gt "$max_bytes" ]; then
              echo "Release asset size is outside expected range: $f ($size bytes)"
              exit 1
            fi
            sha256sum "$f"
          done

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.reserve_release_number.outputs.tag }}
          name: "librustdesk_core Build ${{ needs.reserve_release_number.outputs.release_number }}"
          body: |
            ## 简介

            本次发布为 RustDesk HarmonyOS 原生核心静态库构建产物，用于 HarmonyOS / OpenHarmony 应用侧集成远控核心能力。

            该包基于 RustDesk 官方核心适配构建，包含 arm64 真机调试库和 x86_64 虚拟设备调试库，可直接放入 HAP 项目的对应 ABI 目录使用。

            ## 构建信息

            - 构建环境：Windows Server 2022
            - Rust 工具链：1.88.0
            - 目标平台：aarch64-unknown-linux-ohos + x86_64-unknown-linux-ohos
            - 构建配置：Cargo release profile
            - 发布标签：${{ needs.reserve_release_number.outputs.tag }}

            ## 产物说明

            - librustdesk_core.a：arm64-v8a，适用于 HarmonyOS 真机调试
            - librustdesk_core_x86_64.a：x86_64，适用于 HarmonyOS / OpenHarmony 虚拟设备调试

            ## 使用说明

            下载对应静态库后，复制到 HAP 项目的 `entry/src/main/libs/<ABI>/` 目录，并与当前仓库的 C++ NAPI 桥接层配套使用。
          files: ./release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}