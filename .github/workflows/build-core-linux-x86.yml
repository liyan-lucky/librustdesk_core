name: Build librustdesk_core.a (Linux x86_64)

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build core on Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      TARGET_TRIPLE: x86_64-unknown-linux-ohos
      CLANG_TARGET: x86_64-linux-ohos
      CONFIGURE_HOST: x86_64-unknown-linux-gnu
      TRIPLET: x64-linux
      RUST_TOOLCHAIN_VERSION: "1.88.0"
      RUSTDESK_HARMONY_BUILD_DIR: ${{ github.workspace }}/_build
      CARGO_TARGET_DIR: ${{ github.workspace }}/_build/native_rust_core/target
      VCPKG_ROOT: ${{ github.workspace }}/_build/vcpkg
      VCPKG_INSTALLED_ROOT: ${{ github.workspace }}/_build/vcpkg/installed
      RUST_BACKTRACE: full
      CARGO_BUILD_JOBS: "2"
      RELEASE_ARTIFACT_MIN_BYTES: "100000000"
      RELEASE_ARTIFACT_MAX_BYTES: "250000000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: x86_64-unknown-linux-ohos

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build autoconf automake libtool \
            pkg-config perl python3 curl git unzip

      - name: Prepare build directories
        run: |
          mkdir -p "$RUSTDESK_HARMONY_BUILD_DIR" "$VCPKG_ROOT" "$VCPKG_INSTALLED_ROOT"

      - name: Download OpenHarmony SDK
        env:
          OHOS_SDK_ZIP_URL: ${{ secrets.OHOS_SDK_LINUX_ZIP_URL }}
        run: |
          if [ -z "$OHOS_SDK_ZIP_URL" ]; then
            echo "Missing repository secret: OHOS_SDK_LINUX_ZIP_URL"
            exit 1
          fi

          zip_path="$RUSTDESK_HARMONY_BUILD_DIR/ohos-sdk.zip"
          sdk_root="$RUSTDESK_HARMONY_BUILD_DIR/ohos-sdk"
          curl -fSL -o "$zip_path" "$OHOS_SDK_ZIP_URL"
          mkdir -p "$sdk_root"
          unzip -q -o "$zip_path" -d "$sdk_root"

          clang=$(find "$sdk_root" -name clang -type f | grep -E 'native/llvm/bin/clang$' | head -1)
          if [ -z "$clang" ]; then
            echo "native/llvm/bin/clang was not found."
            find "$sdk_root" -maxdepth 5 -type d | sort | head -200
            exit 1
          fi

          llvm_bin_dir=$(dirname "$clang")
          llvm_dir=$(dirname "$llvm_bin_dir")
          native_dir=$(dirname "$llvm_dir")
          sdk_native_root=$(dirname "$native_dir")

          for required in "$native_dir/llvm/bin/clang++" "$native_dir/llvm/bin/llvm-ar" "$native_dir/llvm/bin/llvm-ranlib"; do
            [ -x "$required" ] || { echo "Missing or not executable: $required"; exit 1; }
          done
          [ -d "$native_dir/sysroot" ] || { echo "sysroot not found: $native_dir/sysroot"; exit 1; }
          [ -d "$native_dir/llvm/lib" ] || { echo "llvm/lib not found: $native_dir/llvm/lib"; exit 1; }

          echo "RUSTDESK_HARMONY_HOST_SDK=$sdk_native_root" >> "$GITHUB_ENV"
          echo "OHOS_SDK_HOME=$sdk_native_root" >> "$GITHUB_ENV"
          echo "OHOS_NDK_HOME=$sdk_native_root" >> "$GITHUB_ENV"
          echo "SDK root: $sdk_native_root"
          ls -la "$native_dir/llvm/bin" | head -80

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/_build/native_rust_core/target
          key: linux-ohos-x86-cargo-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            linux-ohos-x86-cargo-v1-

      - name: Cache OHOS external static libraries
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/_build/vcpkg/installed
            ${{ github.workspace }}/_build/downloads
            ${{ github.workspace }}/_build/build/libsodium
          key: linux-ohos-extlibs-${{ env.TARGET_TRIPLE }}-opus-1.5.2-vpx-1.15.2-yuv-0faf8dd0e004520a61a603a4d2996d5ecc80dc3f-libsodium-0.2.7
          restore-keys: |
            linux-ohos-extlibs-${{ env.TARGET_TRIPLE }}-

      - name: Prepare libsodium-sys source
        run: |
          registry_src="$HOME/.cargo/registry/src"
          crate_dir="$registry_src/manual/libsodium-sys-0.2.7"
          if [ ! -d "$crate_dir" ]; then
            fetch_dir="$RUNNER_TEMP/libsodium-sys-fetch"
            rm -rf "$fetch_dir"
            mkdir -p "$fetch_dir/src" "$registry_src/manual"
            cat > "$fetch_dir/Cargo.toml" <<'EOF'
          [package]
          name = "libsodium-sys-fetch"
          version = "0.1.0"
          edition = "2021"

          [dependencies]
          libsodium-sys = "=0.2.7"
          EOF
            printf 'pub fn libsodium_sys_fetch_dummy() {}\n' > "$fetch_dir/src/lib.rs"
            CARGO_NET_RETRY=5 cargo fetch --manifest-path "$fetch_dir/Cargo.toml"
            fetched_crate=$(find "$registry_src" -mindepth 2 -maxdepth 2 -type d -name 'libsodium-sys-0.2.7' | grep -v '/manual/' | head -n 1)
            [ -n "$fetched_crate" ] || { echo "libsodium-sys-0.2.7 not found after cargo fetch"; exit 1; }
            cp -a "$fetched_crate" "$crate_dir"
          fi
          test -d "$crate_dir/libsodium"

      - name: Build libopus for OHOS x86_64
        run: |
          opus_version="1.5.2"
          opus_root="$RUSTDESK_HARMONY_BUILD_DIR/opus-x86_64"
          opus_tar="$RUSTDESK_HARMONY_BUILD_DIR/downloads/opus-$opus_version.tar.gz"
          install_root="$VCPKG_INSTALLED_ROOT/$TRIPLET"
          include_dir="$install_root/include"
          lib_dir="$install_root/lib"
          if [ -f "$include_dir/opus/opus_multistream.h" ] && [ -f "$lib_dir/libopus.a" ]; then exit 0; fi
          mkdir -p "$opus_root" "$include_dir" "$lib_dir" "$(dirname "$opus_tar")"
          [ -f "$opus_tar" ] || curl -fSL -o "$opus_tar" "https://downloads.xiph.org/releases/opus/opus-$opus_version.tar.gz"
          rm -rf "$opus_root" && mkdir -p "$opus_root"
          tar -xzf "$opus_tar" -C "$opus_root" --strip-components=1
          sdk_llvm_bin="$RUSTDESK_HARMONY_HOST_SDK/native/llvm/bin"
          sdk_sysroot="$RUSTDESK_HARMONY_HOST_SDK/native/sysroot"
          cd "$opus_root"
          export CC="$sdk_llvm_bin/clang"
          export AR="$sdk_llvm_bin/llvm-ar"
          export RANLIB="$sdk_llvm_bin/llvm-ranlib"
          export STRIP=":"
          export SYSROOT="$sdk_sysroot"
          export CFLAGS="--target=$CLANG_TARGET --sysroot=$SYSROOT -fPIC -D__MUSL__"
          export LDFLAGS="--target=$CLANG_TARGET --sysroot=$SYSROOT"
          ./configure --host="$CONFIGURE_HOST" --prefix="$install_root" --enable-shared=no --enable-static=yes --disable-extra-programs --disable-doc --disable-asm --disable-rtcd --disable-intrinsics
          make -j$(nproc)
          make install
          test -f "$include_dir/opus/opus_multistream.h"
          test -f "$lib_dir/libopus.a"

      - name: Build libvpx for OHOS x86_64
        run: |
          version="1.15.2"
          install_root="$VCPKG_INSTALLED_ROOT/$TRIPLET"
          include_dir="$install_root/include"
          lib_dir="$install_root/lib"
          source_dir="$RUSTDESK_HARMONY_BUILD_DIR/external-src/libvpx-$version-x86_64"
          archive_path="$RUSTDESK_HARMONY_BUILD_DIR/downloads/libvpx-$version.tar.gz"
          if [ -f "$include_dir/vpx/vpx_decoder.h" ] && [ -f "$lib_dir/libvpx.a" ]; then exit 0; fi
          rm -rf "$source_dir" && mkdir -p "$source_dir" "$include_dir" "$lib_dir" "$(dirname "$archive_path")"
          [ -f "$archive_path" ] || curl -fSL -o "$archive_path" "https://github.com/webmproject/libvpx/archive/refs/tags/v$version.tar.gz"
          tar -xzf "$archive_path" -C "$source_dir" --strip-components=1
          sdk_llvm_bin="$RUSTDESK_HARMONY_HOST_SDK/native/llvm/bin"
          sdk_sysroot="$RUSTDESK_HARMONY_HOST_SDK/native/sysroot"
          arch_include="$sdk_sysroot/usr/include/x86_64-linux-ohos"
          usr_include="$sdk_sysroot/usr/include"
          cd "$source_dir"
          rm -rf build-ohos && mkdir -p build-ohos && cd build-ohos
          export PATH="$sdk_llvm_bin:$PATH"
          export CC="$sdk_llvm_bin/clang"
          export CXX="$sdk_llvm_bin/clang++"
          export AS="$sdk_llvm_bin/clang"
          export LD="$sdk_llvm_bin/ld.lld"
          export AR="$sdk_llvm_bin/llvm-ar"
          export RANLIB="$sdk_llvm_bin/llvm-ranlib"
          export NM="$sdk_llvm_bin/llvm-nm"
          export STRIP=":"
          export CFLAGS="--target=$CLANG_TARGET --sysroot=$sdk_sysroot -I$arch_include -I$usr_include -D__MUSL__ -fPIC -O2"
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="--target=$CLANG_TARGET --sysroot=$sdk_sysroot"
          ../configure --target=x86_64-linux-gcc --prefix="$install_root" --libdir="$install_root/lib" --enable-static --disable-shared --disable-examples --disable-tools --disable-docs --disable-unit-tests --disable-install-bins --disable-install-srcs --disable-dependency-tracking --disable-runtime-cpu-detect --enable-vp8 --enable-vp9 --enable-vp9-highbitdepth
          make -j$(nproc) libvpx.a
          mkdir -p "$install_root/include/vpx" "$install_root/lib/pkgconfig"
          cp -f libvpx.a "$install_root/lib/libvpx.a"
          for h in vp8.h vp8cx.h vp8dx.h vpx_codec.h vpx_decoder.h vpx_encoder.h vpx_ext_ratectrl.h vpx_frame_buffer.h vpx_image.h vpx_integer.h vpx_tpl.h; do cp -f "../vpx/$h" "$install_root/include/vpx/$h"; done

      - name: Build libyuv for OHOS x86_64
        run: |
          revision="0faf8dd0e004520a61a603a4d2996d5ecc80dc3f"
          install_root="$VCPKG_INSTALLED_ROOT/$TRIPLET"
          include_dir="$install_root/include"
          lib_dir="$install_root/lib"
          source_dir="$RUSTDESK_HARMONY_BUILD_DIR/external-src/libyuv-$revision"
          archive_path="$RUSTDESK_HARMONY_BUILD_DIR/downloads/libyuv-$revision.tar.gz"
          if [ -f "$include_dir/libyuv/convert_argb.h" ] && [ -f "$lib_dir/libyuv.a" ]; then exit 0; fi
          rm -rf "$source_dir" && mkdir -p "$source_dir" "$(dirname "$archive_path")"
          [ -f "$archive_path" ] || curl -fSL -o "$archive_path" "https://github.com/lemenkov/libyuv/archive/$revision.tar.gz"
          tar -xzf "$archive_path" -C "$source_dir" --strip-components=1
          sdk_llvm_bin="$RUSTDESK_HARMONY_HOST_SDK/native/llvm/bin"
          sdk_sysroot="$RUSTDESK_HARMONY_HOST_SDK/native/sysroot"
          build_dir="$RUSTDESK_HARMONY_BUILD_DIR/external-src/libyuv-$revision-build-x86_64"
          rm -rf "$build_dir" && mkdir -p "$build_dir" "$include_dir" "$lib_dir"
          c_flags="--target=$CLANG_TARGET --sysroot=$sdk_sysroot -D__MUSL__ -fPIC -O2"
          cmake -S "$source_dir" -B "$build_dir" -G Ninja -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=x86_64 -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER="$sdk_llvm_bin/clang" -DCMAKE_CXX_COMPILER="$sdk_llvm_bin/clang++" -DCMAKE_AR="$sdk_llvm_bin/llvm-ar" -DCMAKE_RANLIB="$sdk_llvm_bin/llvm-ranlib" -DCMAKE_C_FLAGS="$c_flags" -DCMAKE_CXX_FLAGS="$c_flags" -DCMAKE_EXE_LINKER_FLAGS="--target=$CLANG_TARGET --sysroot=$sdk_sysroot" -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_DISABLE_FIND_PACKAGE_JPEG=ON -DTEST=OFF -DCMAKE_INSTALL_PREFIX="$install_root"
          cmake --build "$build_dir" --config Release --target yuv --parallel $(nproc)
          cp -f "$build_dir/libyuv.a" "$lib_dir/libyuv.a"
          mkdir -p "$include_dir/libyuv"
          cp -rf "$source_dir/include/libyuv/"* "$include_dir/libyuv/"

      - name: Build libsodium for OHOS x86_64
        run: |
          install_dir="$RUSTDESK_HARMONY_BUILD_DIR/build/libsodium/$TARGET_TRIPLE"
          final_lib="$install_dir/lib/liblibsodium.a"
          if [ -f "$final_lib" ]; then exit 0; fi
          source_dir="$HOME/.cargo/registry/src/manual/libsodium-sys-0.2.7/libsodium"
          [ -d "$source_dir" ] || { echo "libsodium source not found: $source_dir"; exit 1; }
          work_root="$RUSTDESK_HARMONY_BUILD_DIR/external-src/libsodium-$TARGET_TRIPLE"
          rm -rf "$work_root" "$install_dir"
          mkdir -p "$work_root/source" "$install_dir"
          cp -rf "$source_dir" "$work_root/source/libsodium"
          sdk_llvm_bin="$RUSTDESK_HARMONY_HOST_SDK/native/llvm/bin"
          sdk_sysroot="$RUSTDESK_HARMONY_HOST_SDK/native/sysroot"
          arch_include="$sdk_sysroot/usr/include/x86_64-linux-ohos"
          usr_include="$sdk_sysroot/usr/include"
          cd "$work_root/source/libsodium"
          export PATH="$sdk_llvm_bin:$PATH"
          export CC="$sdk_llvm_bin/clang"
          export LD="$sdk_llvm_bin/ld.lld"
          export AR="$sdk_llvm_bin/llvm-ar"
          export RANLIB="$sdk_llvm_bin/llvm-ranlib"
          export NM="$sdk_llvm_bin/llvm-nm"
          export STRIP=":"
          export LDCONFIG=":"
          export CFLAGS="--target=$CLANG_TARGET --sysroot=$sdk_sysroot -I$arch_include -I$usr_include -D__MUSL__"
          ./configure --host="$CONFIGURE_HOST" --prefix="$install_dir" --libdir="$install_dir/lib" --enable-shared=no
          make -j$(nproc) all
          make install
          cp -f "$install_dir/lib/libsodium.a" "$install_dir/lib/liblibsodium.a"
          test -f "$final_lib"

      - name: Build librustdesk_core.a
        run: |
          chmod +x scripts/build_native_bridge.sh scripts/_ohos-sdk-env.sh scripts/x86_64-unknown-linux-ohos-clang.sh scripts/x86_64-unknown-linux-ohos-clang++.sh scripts/ohos-llvm-ar.sh
          unset SODIUM_LIB_DIR || true
          ./scripts/build_native_bridge.sh "$TARGET_TRIPLE" release
          cp -f "entry/src/main/libs/x86_64/librustdesk_core.a" ./librustdesk_core_x86_64.a
          ls -la ./librustdesk_core_x86_64.a

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: librustdesk_core_linux_x86_64
          path: librustdesk_core_x86_64.a
          if-no-files-found: error

      - name: Validate final artifact
        run: |
          artifact="./librustdesk_core_x86_64.a"
          test -f "$artifact"
          ls -la "$artifact"
          size=$(stat -c%s "$artifact")
          if [ "$size" -lt "$RELEASE_ARTIFACT_MIN_BYTES" ] || [ "$size" -gt "$RELEASE_ARTIFACT_MAX_BYTES" ]; then
            echo "Unexpected artifact size: $size"
            exit 1
          fi
          sha256sum "$artifact"

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: core-linux-x86-${{ github.run_number }}
          name: "librustdesk_core Linux x86_64 Build ${{ github.run_number }}"
          body: |
            Linux online build for librustdesk_core_x86_64.a.

            Target platform: x86_64-unknown-linux-ohos
            Build profile: Cargo release
          files: librustdesk_core_x86_64.a
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
