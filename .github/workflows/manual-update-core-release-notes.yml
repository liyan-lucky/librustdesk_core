name: Manual update core release notes

on:
  workflow_dispatch:
    inputs:
      build_os:
        description: 'Build OS label for release notes.'
        required: false
        default: 'Ubuntu 22.04'
        type: string

permissions:
  contents: write

jobs:
  update_notes:
    name: Update latest core release notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate latest core release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(
            gh release list --repo "${{ github.repository }}" --limit 50 --json tagName,createdAt \
              --jq '[.[] | select(.tagName | test("^core-[0-9]{3}$"))] | sort_by(.createdAt) | last | .tagName'
          )
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "No core release found."
            exit 1
          fi
          number="${tag#core-}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        env:
          RELEASE_NUMBER: ${{ steps.release.outputs.number }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          BUILD_OS: ${{ inputs.build_os }}
        run: |
          bash .github/scripts/write-core-release-notes.sh release-notes.md

      - name: Update release notes only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "${{ steps.release.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --notes-file release-notes.md
