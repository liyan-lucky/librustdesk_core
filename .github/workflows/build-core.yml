name: Build librustdesk_core.a

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  build:
    name: Build core for HarmonyOS
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-ohos

      - name: Install OHOS cross-compile tools
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build pkg-config libx11-dev libxfixes-dev libxrandr-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-3-dev libva-dev libvdpau-dev libasound2-dev libunwind-dev libclang-dev

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build librustdesk_core.a
        shell: bash
        run: |
          cd native_rust_core
          cargo build --release --target aarch64-unknown-linux-ohos 2>&1 || {
            echo "Standard build failed, trying with custom linker flags..."
            RUSTFLAGS="-C link-arg=-Wl,--unresolved-symbols=ignore-all" cargo build --release --target aarch64-unknown-linux-ohos 2>&1
          }
          cp ../target/aarch64-unknown-linux-ohos/release/librustdesk_harmony_bridge.a ../librustdesk_core.a 2>/dev/null || true
          if [ ! -f ../librustdesk_core.a ]; then
            find ../target -name "librustdesk_harmony_bridge.a" -exec cp {} ../librustdesk_core.a \;
          fi
          ls -lh ../librustdesk_core.a

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: librustdesk_core
          path: librustdesk_core.a
          if-no-files-found: warn

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: librustdesk_core.a
