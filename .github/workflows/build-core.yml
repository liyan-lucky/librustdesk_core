name: Build librustdesk_core.a

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
  
permissions:
  contents: write

jobs:
  build:
    name: Build core for HarmonyOS
    runs-on: windows-2022
    timeout-minutes: 120

    env:
      TARGET_TRIPLE: aarch64-unknown-linux-ohos
      RUST_TOOLCHAIN_VERSION: "1.88.0"
      RUSTDESK_HARMONY_BUILD_DIR: ${{ github.workspace }}\_build
      CARGO_TARGET_DIR: ${{ github.workspace }}\_build\native_rust_core\target
      VCPKG_ROOT: ${{ github.workspace }}\_build\vcpkg
      VCPKG_INSTALLED_ROOT: ${{ github.workspace }}\_build\vcpkg\installed
      RUST_BACKTRACE: full
      CARGO_BUILD_JOBS: 1
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
      CARGO_PROFILE_RELEASE_STRIP: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-unknown-linux-ohos

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          install: >-
            base-devel
            make
            perl
            autoconf
            automake
            libtool
            pkgconf

      - name: Prepare build directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUSTDESK_HARMONY_BUILD_DIR" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_ROOT" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_INSTALLED_ROOT" | Out-Null

      - name: Download OpenHarmony SDK
        shell: pwsh
        env:
          OHOS_SDK_ZIP_URL: ${{ secrets.OHOS_SDK_ZIP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OHOS_SDK_ZIP_URL)) {
            throw "Missing repository secret: OHOS_SDK_ZIP_URL"
          }

          $zip = Join-Path $env:RUSTDESK_HARMONY_BUILD_DIR "ohos-sdk.zip"
          $sdkRoot = Join-Path $env:RUSTDESK_HARMONY_BUILD_DIR "ohos-sdk"

          Invoke-WebRequest -Uri $env:OHOS_SDK_ZIP_URL -OutFile $zip
          New-Item -ItemType Directory -Force -Path $sdkRoot | Out-Null
          Expand-Archive -Path $zip -DestinationPath $sdkRoot -Force

          $clang = Get-ChildItem -Path $sdkRoot -Recurse -Filter clang.exe | Where-Object {
            $_.FullName -like "*native*llvm*bin*clang.exe"
          } | Select-Object -First 1

          if (-not $clang) {
            throw "clang.exe not found"
          }

          $llvmBinDir = Split-Path -Parent $clang.FullName
          $llvmDir = Split-Path -Parent $llvmBinDir
          $nativeDir = Split-Path -Parent $llvmDir
          $sdkNativeRoot = Split-Path -Parent $nativeDir

          if (-not (Test-Path (Join-Path $nativeDir "sysroot"))) {
            throw "sysroot not found. Expected: $nativeDir\sysroot"
          }

          if (-not (Test-Path (Join-Path $nativeDir "llvm\lib"))) {
            throw "llvm/lib not found. Expected: $nativeDir\llvm\lib"
          }

          "RUSTDESK_HARMONY_HOST_SDK=$sdkNativeRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OHOS_SDK_HOME=$sdkNativeRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OHOS_NDK_HOME=$sdkNativeRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "SDK root: $sdkNativeRoot"
          Write-Host "Native dir: $nativeDir"
          Get-ChildItem "$nativeDir" | Select-Object Name

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}\_build\native_rust_core\target
          key: windows-ohos-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            windows-ohos-cargo-

      - name: Prepare libsodium-sys source
        shell: pwsh
        run: |
          $registrySrc = Join-Path $env:CARGO_HOME "registry\src\manual"
          $crateDir = Join-Path $registrySrc "libsodium-sys-0.2.7"

          if (-not (Test-Path $crateDir)) {
            New-Item -ItemType Directory -Force -Path $registrySrc | Out-Null
            $crateFile = Join-Path $env:RUNNER_TEMP "libsodium-sys-0.2.7.crate"
            Invoke-WebRequest -Uri "https://crates.io/api/v1/crates/libsodium-sys/0.2.7/download" -OutFile $crateFile
            tar -xzf $crateFile -C $registrySrc
          }

      - name: Prepare libopus for magnum-opus
        shell: pwsh
        run: |
          $opusVersion = "1.5.2"
          $triplet = "arm64-linux"
          $opusRoot = Join-Path $env:RUSTDESK_HARMONY_BUILD_DIR "opus"
          $opusZip = Join-Path $env:RUNNER_TEMP "opus-$opusVersion.tar.gz"
          $installRoot = Join-Path $env:VCPKG_INSTALLED_ROOT $triplet
          $includeDir = Join-Path $installRoot "include"
          $libDir = Join-Path $installRoot "lib"

          New-Item -ItemType Directory -Force -Path $opusRoot | Out-Null
          New-Item -ItemType Directory -Force -Path $includeDir | Out-Null
          New-Item -ItemType Directory -Force -Path $libDir | Out-Null

          Invoke-WebRequest -Uri "https://downloads.xiph.org/releases/opus/opus-$opusVersion.tar.gz" -OutFile $opusZip
          tar -xzf $opusZip -C $opusRoot --strip-components=1

          $env:PATH = "C:\msys64\usr\bin;$env:PATH"

          $opusRootUnix = & C:\msys64\usr\bin\cygpath.exe -u $opusRoot
          $installRootUnix = & C:\msys64\usr\bin\cygpath.exe -u $installRoot
          $sdkUnix = & C:\msys64\usr\bin\cygpath.exe -u $env:RUSTDESK_HARMONY_HOST_SDK

          $bashScript = Join-Path $env:RUNNER_TEMP "build-opus-ohos.sh"

          $lines = @(
            "set -euo pipefail",
            "cd `"$opusRootUnix`"",
            "export CC=`"$sdkUnix/native/llvm/bin/clang.exe`"",
            "export AR=`"$sdkUnix/native/llvm/bin/llvm-ar.exe`"",
            "export RANLIB=`"$sdkUnix/native/llvm/bin/llvm-ranlib.exe`"",
            "export STRIP=`":`"",
            "export SYSROOT=`"$sdkUnix/native/sysroot`"",
            "export CFLAGS=`"--target=aarch64-linux-ohos --sysroot=`$SYSROOT -fPIC -D__MUSL__`"",
            "export LDFLAGS=`"--target=aarch64-linux-ohos --sysroot=`$SYSROOT`"",
            "./configure --host=aarch64-unknown-linux-gnu --prefix=`"$installRootUnix`" --enable-shared=no --enable-static=yes --disable-extra-programs --disable-doc",
            "make -j2",
            "make install"
          )

          $lines | Set-Content -Path $bashScript -Encoding ascii

          Write-Host "==== build-opus-ohos.sh ===="
          Get-Content $bashScript

          & C:\msys64\usr\bin\bash.exe $bashScript

          $header = Join-Path $includeDir "opus\opus_multistream.h"
          $libA = Join-Path $libDir "libopus.a"

          if (-not (Test-Path $header)) {
            throw "opus header not found: $header"
          }

          if (-not (Test-Path $libA)) {
            throw "libopus.a not found: $libA"
          }

          Write-Host "libopus prepared:"
          Get-Item $header, $libA | Format-List FullName,Length
      - name: Build librustdesk_core.a
        shell: pwsh
        run: |
          & powershell -ExecutionPolicy Bypass -File .\scripts\build_native_bridge.ps1 -TargetTriple "$env:TARGET_TRIPLE" -Profile dev

          if ($LASTEXITCODE -ne 0) {
            throw "build_native_bridge.ps1 failed with exit code $LASTEXITCODE"
          }

          $builtLib = ".\entry\src\main\libs\arm64\librustdesk_core.a"
          if (-not (Test-Path $builtLib)) {
            throw "Native build finished, but $builtLib was not found"
          }

          Copy-Item -LiteralPath $builtLib -Destination ".\librustdesk_core.a" -Force

      - name: Upload debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-logs
          path: |
            build_debug_*.log
            cargo_build_*.log
            build_env_*.log
            _build/build-native-bridge-*.cmd
          if-no-files-found: ignore

      - name: Verify artifact
        shell: pwsh
        run: |
          Write-Host "===== Searching Build Outputs ====="

          Get-ChildItem -Path . -Recurse -Filter "*.a" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "$($_.FullName)"
          }

          $artifact = $null

          if (Test-Path ".\librustdesk_core.a") {
            $artifact = ".\librustdesk_core.a"
          }
          elseif (Test-Path ".\entry\src\main\libs\arm64\librustdesk_core.a") {
            $artifact = ".\entry\src\main\libs\arm64\librustdesk_core.a"
          }
          elseif (Test-Path ".\_build\native_rust_core\target\harmony\librustdesk_harmony_bridge.a") {
            $artifact = ".\_build\native_rust_core\target\harmony\librustdesk_harmony_bridge.a"
          }

          if (-not $artifact) {
            throw "No static library found"
          }

          $source = (Resolve-Path $artifact).Path
          $target = (Join-Path (Get-Location) "librustdesk_core.a")

          if ($source -ne $target) {
            Copy-Item -LiteralPath $source -Destination $target -Force
          } else {
            Write-Host "Artifact already exists at target path, skip copy."
          }

          Get-Item ".\librustdesk_core.a" | Format-List Name,Length,FullName

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: librustdesk_core
          path: |
            librustdesk_core.a
            entry/src/main/libs/arm64/librustdesk_core.a
            _build/native_rust_core/target/harmony/**
          if-no-files-found: warn

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: core-${{ github.run_number }}
          name: librustdesk_core Build ${{ github.run_number }}
          files: |
            librustdesk_core.a
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
