name: Build librustdesk_core.a

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  build:
    name: Build core for HarmonyOS
    runs-on: windows-2022
    timeout-minutes: 120

    env:
      TARGET_TRIPLE: aarch64-unknown-linux-ohos
      RUSTDESK_HARMONY_BUILD_DIR: ${{ github.workspace }}\_build
      CARGO_TARGET_DIR: ${{ github.workspace }}\_build\native_rust_core\target
      VCPKG_ROOT: ${{ github.workspace }}\_build\vcpkg
      VCPKG_INSTALLED_ROOT: ${{ github.workspace }}\_build\vcpkg\installed
      RUST_BACKTRACE: full
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
      CARGO_PROFILE_RELEASE_STRIP: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-ohos

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          install: >-
            base-devel
            make
            perl
            autoconf
            automake
            libtool
            pkgconf

      - name: Prepare build directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUSTDESK_HARMONY_BUILD_DIR" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_ROOT" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_INSTALLED_ROOT" | Out-Null

      - name: Download OpenHarmony SDK
        shell: pwsh
        env:
          OHOS_SDK_ZIP_URL: ${{ secrets.OHOS_SDK_ZIP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OHOS_SDK_ZIP_URL)) {
            throw "Missing repository secret: OHOS_SDK_ZIP_URL"
          }

          $zip = Join-Path $env:RUSTDESK_HARMONY_BUILD_DIR "ohos-sdk.zip"
          $sdkRoot = Join-Path $env:RUSTDESK_HARMONY_BUILD_DIR "ohos-sdk"

          Invoke-WebRequest -Uri $env:OHOS_SDK_ZIP_URL -OutFile $zip
          New-Item -ItemType Directory -Force -Path $sdkRoot | Out-Null
          Expand-Archive -Path $zip -DestinationPath $sdkRoot -Force

          $clang = Get-ChildItem -Path $sdkRoot -Recurse -Filter clang.exe | Where-Object {
            $_.FullName -like "*native*llvm*bin*clang.exe"
          } | Select-Object -First 1

          if (-not $clang) {
            throw "clang.exe not found. SDK zip must contain native/llvm/bin/clang.exe"
          }

          $sdkNativeRoot = Split-Path -Parent (Split-Path -Parent (Split-Path -Parent $clang.FullName))

          if (-not (Test-Path (Join-Path $sdkNativeRoot "native\sysroot"))) {
            $candidate = Get-ChildItem -Path $sdkRoot -Recurse -Directory -Filter sysroot | Where-Object {
              $_.FullName -like "*native*sysroot"
            } | Select-Object -First 1

            if (-not $candidate) {
              throw "native/sysroot not found in SDK zip"
            }

            $sdkNativeRoot = Split-Path -Parent (Split-Path -Parent $candidate.FullName)
          }

          "RUSTDESK_HARMONY_HOST_SDK=$sdkNativeRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OHOS_SDK_HOME=$sdkNativeRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OHOS_NDK_HOME=$sdkNativeRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "SDK root: $sdkNativeRoot"
          Get-ChildItem "$sdkNativeRoot\native\llvm\bin" | Select-Object -First 20

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}\_build\native_rust_core\target
          key: windows-ohos-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            windows-ohos-cargo-

      - name: Prepare libsodium-sys source
        shell: pwsh
        run: |
          $registrySrc = Join-Path $env:CARGO_HOME "registry\src\manual"
          $crateDir = Join-Path $registrySrc "libsodium-sys-0.2.7"

          if (-not (Test-Path $crateDir)) {
            New-Item -ItemType Directory -Force -Path $registrySrc | Out-Null

            $crateFile = Join-Path $env:RUNNER_TEMP "libsodium-sys-0.2.7.crate"
            Invoke-WebRequest -Uri "https://crates.io/api/v1/crates/libsodium-sys/0.2.7/download" -OutFile $crateFile

            tar -xzf $crateFile -C $registrySrc
          }

          if (-not (Test-Path (Join-Path $crateDir "libsodium\configure"))) {
            throw "libsodium-sys-0.2.7 was downloaded, but libsodium/configure was not found"
          }

          Get-ChildItem $crateDir | Select-Object -First 20

      - name: Build librustdesk_core.a
        shell: pwsh
        run: |
          & powershell -ExecutionPolicy Bypass -File .\scripts\build_native_bridge.ps1 -TargetTriple "$env:TARGET_TRIPLE" -Profile dev

          if ($LASTEXITCODE -ne 0) {
            Write-Host "==== Search libsodium config.log ===="
            Get-ChildItem -Path "$env:RUSTDESK_HARMONY_BUILD_DIR" -Recurse -Filter config.log -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "==== CONFIG LOG: $($_.FullName) ===="
              Get-Content $_.FullName -Tail 300
            }

            Write-Host "==== Search generated build scripts ===="
            Get-ChildItem -Path "$env:RUSTDESK_HARMONY_BUILD_DIR" -Recurse -Filter build-libsodium.sh -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "==== BUILD SCRIPT: $($_.FullName) ===="
              Get-Content $_.FullName
            }

            Write-Host "==== SDK bin files ===="
            Get-ChildItem -Path "$env:RUSTDESK_HARMONY_HOST_SDK\native\llvm\bin" -ErrorAction SilentlyContinue | Select-Object Name,Length | Format-Table -AutoSize

            Write-Host "==== SDK sysroot check ===="
            Get-ChildItem -Path "$env:RUSTDESK_HARMONY_HOST_SDK\native\sysroot\usr" -ErrorAction SilentlyContinue | Select-Object Name | Format-Table -AutoSize

            Write-Host "==== Cargo target recent files ===="
            Get-ChildItem -Path "$env:CARGO_TARGET_DIR" -Recurse -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 80 FullName,Length,LastWriteTime | Format-Table -AutoSize

            throw "build_native_bridge.ps1 failed with exit code $LASTEXITCODE"
          }

          $builtLib = ".\entry\src\main\libs\arm64\librustdesk_core.a"
          if (-not (Test-Path $builtLib)) {
            throw "Native build finished, but $builtLib was not found"
          }

          Copy-Item -LiteralPath $builtLib -Destination ".\librustdesk_core.a" -Force

      - name: Verify artifact
        shell: pwsh
        run: |
          if (-not (Test-Path ".\librustdesk_core.a")) {
            throw "librustdesk_core.a was not generated"
          }

          Get-Item ".\librustdesk_core.a" | Format-List Name,Length,FullName

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: librustdesk_core
          path: librustdesk_core.a
          if-no-files-found: error