name: Switch Linux and Windows workflow triggers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  switch-triggers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Switch triggers
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          windows = Path('.github/workflows/build-core-windows.yml')
          linux = Path('.github/workflows/build-core-linux.yml')

          w = windows.read_text(encoding='utf-8')
          old_w = 'on:\n  push:\n    branches: [main]\n    paths-ignore:\n      - "**.md"\n  workflow_dispatch:\n'
          new_w = 'on:\n  workflow_dispatch:\n'
          if old_w in w:
              w = w.replace(old_w, new_w, 1)
          elif new_w in w:
              print('Windows workflow already manual only')
          else:
              raise SystemExit('Windows workflow trigger block was not recognized')
          windows.write_text(w, encoding='utf-8')

          l = linux.read_text(encoding='utf-8')
          old_l = 'on:\n  workflow_dispatch:\n'
          new_l = 'on:\n  push:\n    branches: [main]\n    paths-ignore:\n      - "**.md"\n  workflow_dispatch:\n'
          if old_l in l:
              l = l.replace(old_l, new_l, 1)
          elif new_l in l:
              print('Linux workflow already auto + manual')
          else:
              raise SystemExit('Linux workflow trigger block was not recognized')
          linux.write_text(l, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git add .github/workflows/build-core-windows.yml .github/workflows/build-core-linux.yml
          if git diff --cached --quiet; then
            echo "No trigger changes to commit."
            exit 0
          fi
          git commit -m "switch linux and windows workflow triggers"
          git push
