name: Update core release notes

on:
  workflow_run:
    workflows:
      - Build librustdesk_core.a (Linux)
      - Build librustdesk_core.a (Windows)
    types:
      - completed

permissions:
  contents: write

jobs:
  update_notes:
    name: Update Chinese release notes
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate latest core release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(
            gh release list --repo "${{ github.repository }}" --limit 50 --json tagName,createdAt \
              --jq '[.[] | select(.tagName | test("^core-[0-9]{3}$"))] | sort_by(.createdAt) | last | .tagName'
          )
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "No core release found."
            exit 0
          fi
          number="${tag#core-}"
          workflow_name="${{ github.event.workflow_run.name }}"
          if echo "$workflow_name" | grep -qi 'Linux'; then
            build_os="Ubuntu 22.04"
          else
            build_os="Windows Server 2022"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "build_os=$build_os" >> "$GITHUB_OUTPUT"

      - name: Generate Chinese release notes
        if: steps.release.outputs.tag != ''
        env:
          RELEASE_NUMBER: ${{ steps.release.outputs.number }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          BUILD_OS: ${{ steps.release.outputs.build_os }}
        run: |
          bash .github/scripts/write-core-release-notes.sh release-notes.md

      - name: Update release notes only
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "${{ steps.release.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --notes-file release-notes.md
